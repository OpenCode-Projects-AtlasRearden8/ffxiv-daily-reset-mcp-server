[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffxiv-reset-mcp"
version = "0.1.0"
description = "Local MCP server tracking FFXIV daily/weekly reset responsibilities (grand company turn-ins, duty support, beast tribe allowances, item turn-ins, custom chores)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["ffxiv", "mcp", "reset", "agent", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ffxiv-reset-mcp = "ffxiv_reset_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
